name: Deploy GitHub Pages

on:
  push:
    branches: [master]
    # O update-stats.yml commita stats.json todo dia; o badge lê o arquivo pela raw,
    # então o site não precisa redeployar por isso. Sem este paths-ignore, cada commit
    # automático dispara um deploy e as runs concorrentes caem em
    # "Deployment failed, try again later" (uma verde, outra vermelha à toa).
    paths-ignore:
      - 'stats.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
